#    org.apache.kafka: ERROR
#    kafka: ERROR
#    kafka.network: ERROR
#    kafka.request.logger: ERROR
#    kafka.controller: ERROR
#    kafka.log: ERROR
#    state.change.logger: ERROR
#    org.apache.zookeeper: ERROR

logging:
  level:
    org.apache.kafka.clients.consumer: WARN
    org.apache.kafka.clients.producer: WARN
    org.apache.kafka.common: WARN

management:
  endpoints:
    web:
      exposure:
        include: "*"
