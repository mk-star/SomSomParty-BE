spring:
  datasource:
    url: jdbc:mysql://localhost:3306/som
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap_servers: localhost:10000,localhost:10001,localhost:10002
    consumer:
      auto-offset-reset: earliest
  data:
    redis:
      host: localhost
      port: 6379
#      cluster:
