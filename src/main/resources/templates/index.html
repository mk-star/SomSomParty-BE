<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Real-Time Notifications</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h1>Rank</h1>
<div id="rankDisplay">순위가 표시됩니다</div>
<button id="enterQueueBtn">입장</button>

<script>
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, () => {
        const festivalId = '1';
        const maxSlot = 5;

        fetch(`/festivals/${festivalId}/slots?maxSlot=${maxSlot}`, {
            method: 'POST',  // 만약 setMaxSlot이 POST 메서드라면 꼭 지정
        })
            .then(response => response.text())
            .then(data => console.log(data))
            .catch(err => console.error(err));

        document.getElementById('enterQueueBtn').addEventListener('click', () => {
            const userIds = Array.from({ length: 100 }, (_, i) => (i + 1).toString());

            const requests = userIds.map(userId => {
                return fetch(`/queues/${festivalId}/waiting-room/users/${userId}`, { method: 'GET' })
                    .then(response => {
                        if (!response.ok) throw new Error(`대기열 등록 실패 (userId: ${userId})`);
                        return response.text();
                    })
                    .then(() => {
                        console.log(`대기열 등록 성공 (userId: ${userId})`);

                        stompClient.subscribe(`/topic/queue.status.${festivalId}.${userId}`, message => {
                            const data = JSON.parse(message.body);
                            console.log(`[userId: ${userId}] rank: ${data.rank}`);

                            if (userId === '100') {
                                const rankDisplay = document.getElementById('rankDisplay');
                                if (rankDisplay) {
                                    rankDisplay.textContent = data.rank === -1
                                        ? "대기열에 없습니다."
                                        : `현재 순위: ${data.rank}`;
                                }
                            }
                        });
                    })
                    .catch(err => console.error(err));
            });

            // 모든 요청을 동시에 시작
            Promise.all(requests).then(() => {
                console.log('모든 요청 발송 완료');
            });
        });
    });
</script>
</body>
</html>
